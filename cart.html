<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="jquery-3.1.1.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Cart</title>,
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #f8f9fa, #3a17d7);
        }

        .active {
            background-color: #3a17d7;
            color: white;
            border-radius: 10px;
            margin-left: 10px;
        }

        .nav-link {
            font-size: 1.2rem;
            margin-left: 5px;
            margin-right: 5px;
        }

        .nav-link:hover {
            /* margin-top: 7px; */
            /* margin-bottom: 5px; */
            margin-left: 5px;
            margin-right: 5px;
            /* padding: 5px; */
            background-color: #3a17d7;
            border-radius: 10px;
        }

        .logo {
            color: #3a17d7;
        }

        .button {
            background-color: #3a17d7;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 15px;
            cursor: pointer;
        }

        .button:hover {
            background-color: #2c0f9b;
            color: white;
        }

        .navbar {
            position: absolute;
            width: 100%;
            top: 0;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold logo" href="#">
                <i class="fa-solid fa-cart-shopping"></i> Shopping
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link text-light" aria-current="page" href="dashboard.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light" href="profile.html">Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light cart" href="cart.html"><i
                                class="fa-solid fa-cart-shopping"></i></a>
                    </li>
                    <li class="nav-item">
                        <div class="btn button ms-lg-3 logout">Logout</div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="row">

        </div>
    </div>
    <script>
        $(document).ready(function () {
            $('.nav-item').each(function () {
                let currentPath = window.location.pathname.split("/").pop(); // e.g. "cart.html"
                let linkPath = $(this).find('a').attr('href');

                if (linkPath === currentPath) {
                    $(this).find('a').addClass('active');
                } else {
                    $(this).find('a').removeClass('active');
                }
            });
            var products = JSON.parse(localStorage.getItem('cartItems')) || [];
            var currentUser = localStorage.getItem('currentUser');
            if (!currentUser) {
                $('.logout').text('Login').off('click').on('click', function () {
                    window.location.href = 'login.html';
                });
                return
            }
            $('.logout').text('logout').css('background-color', 'red');

            $.fn.displayProducts = function (products) {
                let html = '';
                products.forEach(function (product) {
                    html += `
                <div class="product col-12 col-md-6 col-lg-4 mb-4">
                    <div class="card shadow-sm h-100">
                        <img src="${product.image}" class="card-img-top size p-4" alt="${product.title}" style="height:250px; object-fit:fill;">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">${product.title}</h5>
                            <p class="card-text flex-grow-1">${product.description}</p>
                            <p class="card-price text-center bg-warning w-100 p-2 border rounded"><b>Price:$${product.price}</b></p>
                            <p class="card-price text-center bg-warning w-100 p-2 border rounded"><b>quantity:${product.quantatiy}</b></p>
                            <p class="card-price text-center bg-warning w-100 p-2 border rounded"><b>Subtotal:$${product.price * product.quantatiy}</b></p>
                            <div class="text-center mt-3">
                                <button class="btn btn-primary remove-from-cart">Remove from Cart</button>
                            </div>
                        </div>
                    </div>
                </div>`;
                });
                $('.row').html(html);
            };
            if (products.length === 0) {
                $('.row')
                    .html('<marquee behavior="alternate" direction="right"><h1 class="text-danger">Your cart is empty</h1></marquee>')
                    .addClass('d-flex justify-content-center align-items-center w-100')
                    .css('height', '80vh');
            }
            else {
                $.fn.displayProducts(products);
            }
            $('.remove-from-cart').on('click', function () {
                const productTitle = $(this).closest('.product').find('.card-title').text();
                const productDescription = $(this).closest('.product').find('.card-text').text();
                const productImage = $(this).closest('.product').find('.card-img-top').attr('src');
                const productPrice = parseFloat($(this).closest('.product').find('.card-price').text().replace('$', ''));
                const product = {
                    title: productTitle,
                    description: productDescription,
                    image: productImage,
                    price: productPrice
                };
                console.log(product);
                const cartItems = JSON.parse(localStorage.getItem('cartItems')) || [];
                const updatedCartItems = cartItems.filter(function (item) {
                    return item.title !== product.title;
                });
                localStorage.setItem('cartItems', JSON.stringify(updatedCartItems));
                $.fn.displayProducts(updatedCartItems);
                window.location.reload()
            });

        });
    </script>
</body>

</html>

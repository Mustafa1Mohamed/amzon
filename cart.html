<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="jquery-3.1.1.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Cart</title>,
    <style>
        body {
            background: linear-gradient(to right, #f8f9fa, #3a17d7);
        }
    </style>
</head>

<body>
    <button class="btn btn-primary mt-3"><a href="dashboard.html" class="text-white text-decoration-none"><i class="bi bi-arrow-left"></i> Back</a></button>
    <div class="container mt-5">
        <div class="row">

        </div>
    </div>
    <script>
        $(document).ready(function () {
            var products = JSON.parse(localStorage.getItem('cartItems')) || [];
            $.fn.displayProducts = function (products) {
                let html = '';
                products.forEach(function (product) {
                    html += `
                <div class="product col-12 col-md-6 col-lg-4 mb-4">
                    <div class="card shadow-sm h-100">
                        <img src="${product.image}" class="card-img-top size p-4" alt="${product.title}" style="height:250px; object-fit:fill;">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">${product.title}</h5>
                            <p class="card-text flex-grow-1">${product.description}</p>
                            <p class="card-price bg-warning w-25 p-2 border rounded"><b>$${product.price}</b></p>
                            <div class="text-center mt-3">
                                <button class="btn btn-primary remove-from-cart">Remove from Cart</button>
                            </div>
                        </div>
                    </div>
                </div>`;
                });
                $('.row').html(html);
            };
            $.fn.displayProducts(products);

            $('.remove-from-cart').on('click', function () {
                const productTitle = $(this).closest('.product').find('.card-title').text();
                const productDescription = $(this).closest('.product').find('.card-text').text();
                const productImage = $(this).closest('.product').find('.card-img-top').attr('src');
                const productPrice = parseFloat($(this).closest('.product').find('.card-price').text().replace('$', ''));
                const product = {
                    title: productTitle,
                    description: productDescription,
                    image: productImage,
                    price: productPrice
                };
                console.log(product);
                const cartItems = JSON.parse(localStorage.getItem('cartItems')) || [];
                const updatedCartItems = cartItems.filter(function (item) {
                    return item.title !== product.title;
                });
                localStorage.setItem('cartItems', JSON.stringify(updatedCartItems));
                $.fn.displayProducts(updatedCartItems);
                window.location.reload()
            });
        });
    </script>
</body>

</html>
